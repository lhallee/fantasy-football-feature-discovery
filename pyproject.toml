[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-discovery"
version = "0.1.0"
description = "Leakage-aware discovery of compact next-season fantasy-football predictors."
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "threadpoolctl>=3.1",
    "xgboost>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["fantasy_football*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
